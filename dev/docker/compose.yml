# Disposable Frappe/ERPNext bench for developing and verifying the app.
#   node dev/bench.mjs up [--bench v14|v15]    -> start, create site mcp.localhost, install the app
#   node dev/bench.mjs down [--bench v14|v15]  -> stop and delete everything
# v14 serves on :8014 and v15 on :8015 (image and port are passed in by dev/bench.mjs).
services:
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=admin"]
      interval: 2s
      retries: 60

  redis:
    image: redis:6.2-alpine

  backend:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v14.92.12}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../..:/home/frappe/frappe-bench/apps/mcp_connector
      - sites:/home/frappe/frappe-bench/sites
    ports:
      - "${MCP_BENCH_PORT:-8014}:8000"
    command: ["sleep", "infinity"]

volumes:
  sites:
