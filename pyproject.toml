[project]
name = "mcp_connector"
authors = [
    { name = "Mohammed Ashaibi", email = "mohamed@ashaibi.com", website = "https://ashaibi.com" },
]
description = "Model Context Protocol server for Frappe/ERPNext v14 and v15 with role-based access profiles"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
